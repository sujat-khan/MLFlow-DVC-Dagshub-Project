name: CI Pipeline 

on: push 

jobs:
  project-testing:
    runs-on: ubuntu-latest 

    steps:
      - name: checkout code 
        uses: actions/checkout@v3
        
      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run Pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT || secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN || secrets.DAGSHUB_PAT }}
        run: |
          dvc repro
      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT || secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN || secrets.DAGSHUB_PAT }}
        run: |
          python -m unittest tests/test_model.py
          
      - name: Promote model to production
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT || secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN || secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py
      
      - name: Run Flask app tests
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py

      - name: Login to AWS ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 114757334131.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t sk-learn-ecr .

      - name: Tag Docker image
        run: |
          docker tag sk-learn-ecr:latest 114757334131.dkr.ecr.ap-south-1.amazonaws.com/sk-learn-ecr:latest

      - name: Push Docker image to AWS ECR
        run: |
          docker push 114757334131.dkr.ecr.ap-south-1.amazonaws.com/sk-learn-ecr:latest

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set default.region ap-south-1
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 114757334131.dkr.ecr.ap-south-1.amazonaws.com
            docker pull 114757334131.dkr.ecr.ap-south-1.amazonaws.com/sk-learn-ecr:latest
            docker stop sk-learn-app || true
            docker rm sk-learn-app || true
            docker run -d -p 80:5000 -e DAGSHUB_PAT=${{ secrets.DAGSHUB_PAT || secrets.DAGSHUB_USER_TOKEN }} --name sk-learn-app 114757334131.dkr.ecr.ap-south-1.amazonaws.com/sk-learn-ecr:latest

