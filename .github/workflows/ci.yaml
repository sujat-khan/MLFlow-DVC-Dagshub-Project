name: CI Pipeline 

on: push 

jobs:
  project-testing:
    runs-on: ubuntu-latest 


    steps:
      - name: checkout code 
        uses: actions/checkout@v3
        
      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run Pipeline
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          dvc repro
